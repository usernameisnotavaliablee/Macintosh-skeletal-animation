<title>test 液态玻璃书写动画</title>
<style>
  html, body { margin: 0; height: 100%; background: #16123a; overflow: hidden;

  #shadowInk path { stroke: #0b0630; }

  @keyframes float { to { transform: translate(110px, -70px); } }

    background: rgba(255, 255, 255, .16); color: #fff; opacity: 0; transition: opacity .4s;

<svg id="stage" role="img" aria-label="test">
  <defs>

      <circle cx="40" cy="40" r="4" fill="#fff" fill-opacity=".85"/>
    </pattern>
    <!-- 折射 + 高光,做法见 kube.io/blog/liquid-glass-css-svg:位移图(R/G)驱动 feDisplacementMap,高光图用 feBlend 叠在上面 -->
    <filter id="lens" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">

      <feDisplacementMap id="fd" in="SourceGraphic" in2="map" xChannelSelector="R" yChannelSelector="G" result="refr"/>
      <feColorMatrix in="refr" type="saturate" values="1.35" result="sat"/>
      <feImage id="fiSpec" preserveAspectRatio="none" result="spec"/>

    </filter>
    <filter id="sh" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="9"/></filter>
    <mask id="m" maskUnits="userSpaceOnUse"><g id="maskInk"></g></mask>

  <g id="shadow" filter="url(#sh)" opacity=".5"><g id="shadowInk"></g></g>

const [bx, by, bw, bh] = DATA.box;

// ---- 玻璃参数 ----
const U = 3;             // 位移图 1 像素 = 3 字体单位
const THICK = 1.0;       // 玻璃厚度 / 倒角宽度
const N2 = 1.5;          // 玻璃折射率(空气 = 1)
const REFRACT = 2.4;     // 折射强度倍数(文章里的 Refraction Level)

const LIGHT = -60 * Math.PI / 180;  // 高光方向

// ---- 1. 笔画光栅化 -> 到边缘的距离场 ----
const Wm = Math.ceil(bw / U), Hm = Math.ceil(bh / U);
const cv = document.createElement("canvas"); cv.width = Wm; cv.height = Hm;
const cx = cv.getContext("2d", { willReadFrequently: true });
cx.setTransform(1 / U, 0, 0, 1 / U, -bx / U, -by / U);
cx.lineCap = cx.lineJoin = "round"; cx.lineWidth = DATA.width; cx.strokeStyle = "#000";
DATA.paths.forEach(d => cx.stroke(new Path2D(d)));
const alpha = cx.getImageData(0, 0, Wm, Hm).data;

// Felzenszwalb 欧氏距离变换:f 为 0(边缘外)或 INF(内部),返回到最近外部像素的距离平方
function edt1(f, n, d, v, z) {
  let k = 0; v[0] = 0; z[0] = -1e20; z[1] = 1e20;
  for (let q = 1; q < n; q++) {
    let s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]);
    while (s <= z[k]) { k--; s = ((f[q] + q * q) - (f[v[k]] + v[k] * v[k])) / (2 * q - 2 * v[k]); }
    k++; v[k] = q; z[k] = s; z[k + 1] = 1e20;
  }
  k = 0;
  for (let q = 0; q < n; q++) { while (z[k + 1] < q) k++; d[q] = (q - v[k]) * (q - v[k]) + f[v[k]]; }

for (let i = 0; i < dist.length; i++) dist[i] = alpha[i * 4 + 3] > 127 ? 1e20 : 0;
{
  const m = Math.max(Wm, Hm), f = new Float32Array(m), d = new Float32Array(m);
  const v = new Int32Array(m), z = new Float32Array(m + 1);
  for (let x = 0; x < Wm; x++) {
    for (let y = 0; y < Hm; y++) f[y] = dist[y * Wm + x];
    edt1(f, Hm, d, v, z);
    for (let y = 0; y < Hm; y++) dist[y * Wm + x] = d[y];
  }
  for (let y = 0; y < Hm; y++) {
    for (let x = 0; x < Wm; x++) f[x] = dist[y * Wm + x];

  const src = ds, out = new Float32Array(src.length);
  for (let y = 0; y < Hm; y++) for (let x = 0; x < Wm; x++) {
    let s = 0;
    for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++)
      s += src[Math.min(Hm - 1, Math.max(0, y + j)) * Wm + Math.min(Wm - 1, Math.max(0, x + i))];
    out[y * Wm + x] = s / 9;

// ---- 2. 折射剖面:凸 squircle 表面 + 斯涅尔定律,得到沿倒角的位移幅度 ----
const B = DATA.width / 2 / U;                           // 倒角宽度(像素)= 半个笔宽

for (let i = 0; i < 256; i++) {
  const x = i / 255, e = 0.001, a = Math.max(e, Math.min(1 - e, x));
  const slope = (surf(a + e) - surf(a - e)) / (2 * e) * THICK;

  const gy = ds[Math.min(Hm - 1, y + 1) * Wm + x] - ds[Math.max(0, y - 1) * Wm + x];

// ---- 4. 背景场景(折射的就是它);同一份内容建两份:可见层 + 滤镜源 ----
function buildScene(g, vw, vh) {
  g.replaceChildren();
  el("rect", { x: -200, y: -200, width: vw + 400, height: vh + 400, fill: "url(#bgGrad)" }, g);
  const R = 0.45 * Math.max(vw, vh);
  [[.2, .3, 1, 0], [.8, .25, 2, -5], [.72, .82, 3, -9], [.22, .8, 4, -13]].forEach(([fx, fy, k, delay]) => {

    c.style.animationDelay = delay + "s";

  const d = el("g", { class: "drift" }, g);
  el("rect", { x: -80, y: -80, width: vw + 160, height: vh + 160, fill: "url(#grid)" }, d);
}

// ---- 5. 布局:把词放到视口中央,并把滤镜区域/位移图对齐到词的外框 ----

  const tf = `translate(${X - bx * s} ${Y - by * s}) scale(${s})`;
  $("shadowInk").setAttribute("transform", `translate(0 14) ${tf}`);
  $("maskInk").setAttribute("transform", tf);
  const full = { x: 0, y: 0, width: vw, height: vh };
  for (const [id, at] of [["m", full], ["sh", full], ["lens", { x: X, y: Y, width: W, height: H }],
    ["fiMap", { x: X, y: Y, width: W, height: H }], ["fiSpec", { x: X, y: Y, width: W, height: H }]])
    for (const k in at) $(id).setAttribute(k, at[k]);
  $("fd").setAttribute("scale", (maxDisp * U * s * REFRACT).toFixed(2));
  buildScene($("bg"), vw, vh); buildScene($("glassSrc"), vw, vh);
}
layout();
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(layout, 120); });

// ---- 6. 书写动画(与 test.html 相同)----
// Pen speed follows the 2/3 power law of human handwriting: v ∝ curvature^(-1/3).
const btn = $("replay"), svg = $("stage");

  const els = inks.map(g => { const p = el("path", { d }, g); p.style.strokeWidth = DATA.width; return p; });

  const L = p.getTotalLength(), n = Math.max(8, Math.ceil(L / 25)), ts = [0], ls = [0];
  let prev = p.getPointAtLength(0), ang = null, t = 0;
  for (let k = 1; k <= n; k++) {
    const l = L * k / n, q = p.getPointAtLength(l), a = Math.atan2(q.y - prev.y, q.x - prev.x);

    const v = V * Math.min(1.6, Math.pow(kappa * 900, -1 / 3));
    t += (L / n) / v; ts.push(t); ls.push(l); prev = q; ang = a;
  }
  return { els, L, ts, ls, dur: t };
});
const chunks = [strokes.slice(0, DATA.lift), ...strokes.slice(DATA.lift).map(s => [s])];
let total = 0;
chunks.forEach((c, i) => {
  let t = 0; c.forEach(s => { s.t0 = t; t += s.dur; });
  c.D = t; c.start = total + (i ? LIFT : 0); total = c.start + c.D;
});
const ease = u => .35 * u + .65 * u * u * (3 - 2 * u);  // mostly smoothstep, never stalls
const lenAt = (s, t) => {
  if (t <= 0) return 0; if (t >= s.dur) return s.L;
  let i = 1; while (s.ts[i] < t) i++;
  const f = (t - s.ts[i - 1]) / (s.ts[i] - s.ts[i - 1]);
  return s.ls[i - 1] + f * (s.ls[i] - s.ls[i - 1]);
};
strokes.forEach(s => s.els.forEach(e => e.style.strokeDasharray = `${s.L} ${s.L + 1}`));
const draw = T => chunks.forEach(c => {
  const u = Math.min(1, Math.max(0, (T - c.start) / c.D)), t = ease(u) * c.D;
  c.forEach(s => {
    const l = lenAt(s, t - s.t0);
    s.els.forEach(e => {
      e.style.strokeDashoffset = s.L - l;
      e.style.visibility = l > 0 ? "visible" : "hidden";  // hide the zero-length round-cap dot
    });
  });
});

let raf;
function play() {
  cancelAnimationFrame(raf); btn.classList.remove("show");
  let t0 = null;
  const step = now => {
    t0 ??= now;
    const T = (now - t0) / 1000;
    draw(T);
    if (T < total) raf = requestAnimationFrame(step); else btn.classList.add("show");
  };
  raf = requestAnimationFrame(step);
}
btn.onclick = play;
draw(0); svg.dataset.total = total.toFixed(2);
// ?t=0.5 freezes at that fraction of the timeline (for screenshots / checks)
const q = new URLSearchParams(location.search).get("t");
if (q !== null) { draw(+q * total); btn.classList.add("show"); }
else if (matchMedia("(prefers-reduced-motion: reduce)").matches) { draw(total); btn.classList.add("show"); }
else setTimeout(play, 400);
</script>
</body>
</html>
